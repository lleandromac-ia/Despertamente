# Deploy da API (não roda na Vercel). Frontend: https://despertamente.vercel.app
# Render Dashboard → New → Blueprint → repo Despertamente
# URL esperada após deploy: https://despertamente-api.onrender.com
services:
  - type: web
    name: despertamente-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://despertamente.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      - key: ADMIN_USERNAME
        value: lleandromachado
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: STORAGE_DIR
        value: /data/storage
